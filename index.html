<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persuasion Arena: Mengajak Tanpa Menekan — Materi 4.3</title>
<style>
:root{
  --cream:#FFF8EE;--paper:#FFFFFF;--ink:#1B1F3B;--muted:#5A6088;
  --indigo:#3347FF;--violet:#7A5CFF;--lilac:#E6DFFF;
  --mint:#C9F4DD;--sage:#59C08A;--coral:#FF6F5E;--pink:#FFD3E0;
  --amber:#FFC53D;--sun:#FFF1B8;--sky:#D8ECFF;
  --r:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);line-height:1.5;
  font-family:"Nunito","Quicksand","SF Pro Rounded",ui-rounded,"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background-color:var(--cream);
  background-image:radial-gradient(rgba(27,31,59,.13) 1.3px,transparent 1.4px);background-size:24px 24px}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 8% 10%,rgba(255,197,61,.35),transparent 32%),radial-gradient(circle at 92% 6%,rgba(122,92,255,.28),transparent 34%),radial-gradient(circle at 88% 92%,rgba(89,192,138,.3),transparent 32%),radial-gradient(circle at 6% 88%,rgba(255,111,94,.2),transparent 30%)}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hl{background:linear-gradient(transparent 60%,var(--amber) 60%,var(--amber) 92%,transparent 92%);padding:0 3px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,248,238,.92);backdrop-filter:blur(10px);border-bottom:2.5px solid var(--ink)}
.tb1,.meters{max-width:1120px;margin:0 auto;padding:8px 16px}
.tb1{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:52px;height:52px;flex:none;border:2.5px solid var(--ink);border-radius:18px;background:var(--sun);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);transform:rotate(-4deg)}
.logo svg{width:44px;height:44px}
.brand b{display:block;font-size:16px;line-height:1.1;font-weight:900;letter-spacing:-.01em}.brand small{color:var(--muted);font-size:12px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-width:0;flex:1;justify-content:center}
.chip{border:2.5px solid var(--ink);border-radius:99px;background:#fff;padding:2px 12px;font-size:12.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.alt{background:var(--sun)}
.snd{display:flex;gap:8px;flex:none}
.sbtn{width:42px;height:42px;border:2.5px solid var(--ink);border-radius:16px;background:var(--lilac);box-shadow:3px 3px 0 var(--ink);font-size:18px;position:relative;display:grid;place-items:center;padding:0;line-height:1;transition:transform .12s}
.sbtn:hover{transform:translate(-1px,-1px) rotate(-4deg)}
.sbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.sbtn.off{background:#E8E3D6;opacity:.75}
.sbtn.off:after{content:"";position:absolute;left:7px;right:7px;top:50%;height:4px;margin-top:-2px;background:var(--coral);border:1.5px solid var(--ink);border-radius:4px;transform:rotate(-35deg)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:0}
.meter{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:6px 12px 8px}
.ml{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11.5px;color:var(--muted);font-weight:800;line-height:1.2}
.mv{font-size:20px;color:var(--ink);white-space:nowrap;font-weight:900}
.bar{height:10px;border-radius:99px;background:#EDE8DA;border:2px solid var(--ink);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .7s cubic-bezier(.3,1.3,.5,1),background .4s}
#m-kel i{background:linear-gradient(90deg,var(--indigo),var(--violet))}#m-sik i{background:linear-gradient(90deg,var(--coral),var(--amber))}
.pulse{animation:pulse .55s ease}
.pd{position:absolute;right:10px;top:-15px;font-weight:900;font-size:14px;border:2.5px solid var(--ink);border-radius:99px;padding:0 9px;pointer-events:none;animation:rise 1.1s ease-out forwards;z-index:3}
.pd.pos{background:var(--mint);color:#16693b}.pd.neg{background:var(--pink);color:#b3321f}

.stepper{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;max-width:1120px;margin:0 auto;width:100%;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;font-size:13px;font-weight:800;color:var(--muted)}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#EFE9DA;font-size:12px;color:var(--ink);border:2px solid var(--ink)}
.step.on{background:var(--indigo);color:#fff;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--ink)}.step.on i{background:var(--amber);color:var(--ink)}
.step.done{background:var(--mint);color:var(--ink)}.step.done i{background:var(--sage);color:#fff}

main{flex:1;padding:12px 0 40px}
#stage.enter .bento>*{animation:popin .5s cubic-bezier(.2,.9,.3,1.25) both}
#stage.enter .bento>*:nth-child(2){animation-delay:.07s}#stage.enter .bento>*:nth-child(3){animation-delay:.14s}#stage.enter .bento>*:nth-child(4){animation-delay:.21s}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;padding:0 16px;max-width:1120px;margin:0 auto}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);padding:22px;min-width:0;position:relative}
.c-grad{background:linear-gradient(135deg,#3347FF 0%,#6A4DFF 55%,#B35CFF 100%);color:#fff}
.c-mint{background:var(--mint)}.c-sun{background:var(--sun)}.c-pink{background:var(--pink)}.c-sky{background:var(--sky)}.c-lilac{background:var(--lilac)}
.tag{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border:2.5px solid var(--ink);border-radius:99px;background:var(--amber);color:var(--ink);margin-bottom:10px;transform:rotate(-2deg)}
.tag.w{background:#fff}
h1{font-size:clamp(34px,6vw,60px);line-height:1;letter-spacing:-.03em;font-weight:900}
h2{font-size:clamp(21px,2.8vw,28px);line-height:1.15;margin-bottom:8px;font-weight:900;letter-spacing:-.01em}
h3{font-size:17px;margin-bottom:6px;font-weight:900}
p{margin-bottom:10px}p:last-child{margin-bottom:0}
.muted{color:var(--muted)}.c-grad .muted{color:#E3E0FF}
.hint{font-size:13px;color:var(--muted);font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;overflow:hidden}
.hero>div{position:relative;z-index:1}
.hero svg.scene{width:100%;height:auto;display:block;border:2.5px solid var(--ink);border-radius:22px;background:var(--mint);animation:bob 5s ease-in-out infinite}
.hero .sub{font-size:clamp(17px,2.2vw,22px);font-weight:900;color:var(--amber);margin:8px 0 14px}
.hook{border-left:5px solid var(--amber);padding:2px 0 2px 12px;font-size:15.5px;font-weight:600}
.stk{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stk span{border:2.5px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:900;padding:2px 12px}
.stk span:nth-child(1){background:var(--amber);transform:rotate(-3deg)}.stk span:nth-child(2){background:var(--mint);transform:rotate(2deg)}.stk span:nth-child(3){background:var(--pink);transform:rotate(-1.5deg)}
.hm{position:absolute;right:-8px;bottom:-14px;z-index:2;filter:drop-shadow(3px 3px 0 var(--ink));animation:bob 2.6s ease-in-out infinite}
.dc{position:absolute;pointer-events:none;z-index:0}
.dc.d1{width:120px;height:120px;border-radius:50%;background:rgba(255,197,61,.35);top:-40px;right:30%}
.dc.d2{width:70px;height:70px;border-radius:50%;border:6px solid rgba(255,255,255,.35);bottom:-24px;left:38%}
.dc.d3{width:26px;height:26px;background:rgba(255,255,255,.5);top:18px;left:46%;transform:rotate(20deg);border-radius:6px;animation:spin 8s linear infinite}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-weight:900;font-size:14px}
.field input{font-size:16px;padding:12px 16px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;width:100%;font-weight:700}
.field input:focus{outline:4px solid rgba(255,197,61,.7);outline-offset:1px;background:#FFFEF7}
.field input[aria-invalid="true"]{border-color:#b3321f;background:var(--pink)}
.err{color:#b3321f;font-size:13px;font-weight:800;min-height:18px}
.seg{display:grid;gap:10px}
.seg label{display:flex;gap:10px;align-items:flex-start;border:2.5px solid var(--ink);border-radius:20px;padding:11px 14px;background:#fff;cursor:pointer;transition:transform .12s}
.seg label:hover{transform:translate(-1px,-1px) rotate(-.4deg)}
.seg input{margin-top:4px;accent-color:var(--indigo);width:18px;height:18px}
.seg label.on{background:var(--lilac);box-shadow:4px 4px 0 var(--ink)}
.seg b{display:block;font-size:14.5px}.seg small{color:var(--muted);font-size:12.5px;display:block;line-height:1.35;font-weight:600}
.disc{border:2.5px dashed var(--ink);border-radius:18px;background:var(--sun);padding:10px 14px;font-size:13px;margin-top:12px;font-weight:600}
.mini-card h3{display:flex;align-items:center;gap:8px}
.mini-card .em{font-size:26px}

.btn{border:2.5px solid var(--ink);border-radius:18px;background:var(--indigo);color:#fff;font-weight:900;padding:13px 22px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s;font-size:15px}
.btn:hover:not(:disabled){transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{background:#D6D2C6;color:#77746a;cursor:not-allowed;box-shadow:2px 2px 0 var(--ink)}
.btn.amber{background:var(--amber);color:var(--ink)}.btn.ghost{background:#fff;color:var(--ink)}.btn.coral{background:var(--coral);color:var(--ink)}.btn.mint{background:var(--sage);color:var(--ink)}
.btn.go{animation:wobble 2.2s ease-in-out infinite}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pnum{width:52px;height:52px;flex:none;border-radius:18px;border:2.5px solid var(--ink);background:linear-gradient(135deg,var(--amber),#FF9F5A);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-5deg)}
.phead h2{margin:0}.phead p{margin:0;font-size:14px;font-weight:700}
.sit{border:2.5px solid var(--ink);border-radius:20px;background:var(--sun);padding:12px 16px;margin:8px 0 14px;font-size:14.5px;font-weight:600}
.sit b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#8a5a00;margin-bottom:2px;font-weight:900}
.coach{display:flex;gap:12px;align-items:flex-end;margin:6px 0 14px}
.cm{flex:none;width:62px;height:62px;filter:drop-shadow(2px 2px 0 var(--ink))}
.cm svg{width:100%;height:100%}
.cb{position:relative;border:2.5px solid var(--ink);border-radius:20px 20px 20px 6px;background:var(--lilac);padding:9px 14px;font-size:14px;font-weight:700}
.cb:before{content:"Roti · coach";display:block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin-bottom:1px}

/* Babak 1 */
.compose{border:2.5px solid var(--ink);border-radius:24px;background:#fff;padding:12px 14px 14px;margin:10px 0 16px;box-shadow:4px 4px 0 var(--ink)}
.compose .lb{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.draft{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sky);border:2.5px solid var(--ink);border-radius:20px 20px 6px 20px;padding:10px 12px;line-height:1.5}
.slot{border:2.5px dashed var(--ink);border-radius:14px;padding:4px 12px;font-size:14px;background:#fff;color:var(--muted);font-weight:700}
button.slot{border-style:solid;background:var(--lilac);color:var(--ink);text-align:left;font-weight:700}
button.slot:hover:not(:disabled){box-shadow:3px 3px 0 var(--ink)}
button.slot:disabled{cursor:default;color:var(--ink)}
.slot.q2{background:var(--mint)}.slot.q1{background:var(--sun)}.slot.q0{background:var(--pink)}
.grp{margin-bottom:16px}
.gh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.gn{width:32px;height:32px;flex:none;border-radius:12px;border:2.5px solid var(--ink);background:var(--amber);display:grid;place-items:center;font-weight:900;transform:rotate(-4deg)}
.gh b{display:block;font-size:15px;line-height:1.2}.gh small{color:var(--muted);font-size:12.5px;font-weight:700}
.chipwrap{display:grid;gap:8px}
.cp{text-align:left;border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:10px 14px;font-size:14px;font-weight:600;transition:transform .12s,box-shadow .12s,background .2s}
.cp:hover:not(:disabled){transform:translate(-2px,-2px) rotate(-.5deg);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.cp.on{background:var(--lilac);box-shadow:4px 4px 0 var(--ink)}
.cp.tried{background:#F1EEE6;opacity:.6;text-decoration:line-through;text-decoration-color:rgba(27,31,59,.35)}
.cp .tt{display:block;font-size:11.5px;font-weight:900;text-decoration:none;color:#b3321f;margin-top:2px}
.glock{border:2.5px dashed var(--ink);border-radius:18px;background:var(--mint);padding:10px 14px;font-weight:800;font-size:14px}
.fbrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;margin-bottom:8px;background:#fff;font-size:14px;font-weight:600}
.fbrow.q2{background:var(--mint)}.fbrow.q1{background:var(--sun)}.fbrow.q0{background:var(--pink)}
.qt{font-size:12px;font-weight:900;border:2.5px solid var(--ink);border-radius:99px;padding:0 10px;background:#fff;white-space:nowrap}
.react{border:2.5px solid var(--ink);border-radius:24px;background:#fff;padding:14px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rhead b{display:block}.rhead span{font-size:13px;color:var(--muted);font-weight:700}
.team{display:grid;gap:10px}
.mem{display:flex;gap:10px;align-items:flex-end;animation:slideIn .5s both}
.mem:nth-child(2){animation-delay:.25s}.mem:nth-child(3){animation-delay:.5s}
.mem .f{width:50px;height:50px;flex:none;border:2.5px solid var(--ink);border-radius:50%;overflow:hidden;background:#fff}
.mem .bb{border:2.5px solid var(--ink);border-radius:18px 18px 18px 6px;padding:8px 14px;font-size:14px;background:var(--sky);font-weight:600;position:relative}
.mem .bb small{display:block;font-weight:900;color:var(--muted);font-size:12px}
.mem .em{position:absolute;right:-6px;top:-14px;font-size:20px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 5px;line-height:1.3;animation:bob 2s ease-in-out infinite}
.t-hi .bb{background:var(--mint)}.t-low .bb,.t-bad .bb{background:var(--pink)}.t-mid .bb{background:var(--sun)}
.fb{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:2.5px solid var(--ink);border-radius:22px;padding:12px 16px;margin:14px 0;font-weight:600;box-shadow:4px 4px 0 var(--ink)}
.fb .fm{width:58px;height:58px}.fb .fm svg{width:100%;height:100%}
.fb.hi{background:var(--mint)}.fb.mid{background:var(--sun)}.fb.low,.fb.bad{background:var(--pink)}
.fb b{font-weight:900}
.fb>div>b:first-child{display:block;margin-bottom:3px;font-size:16px}
.delta{display:inline-block;border:2.5px solid var(--ink);border-radius:99px;padding:1px 12px;font-weight:900;font-size:13px;background:#fff;margin:2px 4px 2px 0}
.delta.pos{background:var(--mint)}.delta.neg{background:var(--pink)}

/* Babak 2 */
.ob{display:flex;gap:10px;align-items:flex-end;margin:8px 0 12px}
.ob .bb{border:2.5px solid var(--ink);border-radius:20px 20px 20px 6px;padding:10px 16px;background:var(--pink);font-size:14.5px;font-weight:700}
.ob .bb small{display:block;font-weight:900;color:var(--muted);font-size:12px}
.ob .f{width:50px;height:50px;flex:none;border:2.5px solid var(--ink);border-radius:50%;overflow:hidden;background:#fff}
.phs{display:grid;gap:10px;margin:12px 0}
.phr{display:block;text-align:left;width:100%;color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:14.5px;font-weight:600;transition:transform .12s,box-shadow .12s,background .2s}
.phr:hover:not(:disabled){transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}
.phr:disabled{cursor:default}
.phr.flag{background:var(--pink);box-shadow:4px 4px 0 var(--ink)}
.phr.ok{background:var(--mint)}.phr.bad{background:var(--pink);border-style:dashed}.phr.fine{background:#F6F3EA}
.ftag{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;border:2px solid var(--ink);border-radius:99px;background:var(--coral);padding:0 8px;margin-right:6px}
.phr .vd{display:block;font-weight:900;font-size:13px;margin-top:8px}
.phr .why{display:block;font-size:13px;color:#3a4062;margin-top:3px;line-height:1.4;font-weight:600}
.starleg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.starleg span{border:2.5px solid var(--ink);border-radius:99px;padding:0 12px;font-weight:900;font-size:13px;background:var(--sun)}
.starleg span:nth-child(2n){background:var(--lilac)}
.slotrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:2.5px dashed var(--ink);border-radius:18px;padding:8px 12px;min-height:58px;background:#fff;margin-bottom:8px;font-size:14px;font-weight:600}
.slotrow.filled{border-style:solid;background:var(--lilac)}
.slotrow.ok{background:var(--mint)}.slotrow.bad{background:var(--pink)}
.slotrow .no{width:32px;height:32px;border-radius:12px;border:2.5px solid var(--ink);background:var(--amber);font-weight:900;display:grid;place-items:center;transform:rotate(-4deg)}
.slotrow small{display:block;color:#3a4062;margin-top:3px;font-size:13px;line-height:1.4}
.ctl{display:flex;gap:4px}
.mini{width:32px;height:32px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;font-size:13px;padding:0;line-height:1}
.mini:hover:not(:disabled){background:var(--sun)}.mini:disabled{opacity:.35;cursor:default}
.pool{display:grid;gap:8px;margin:10px 0 14px}
.stepcard{text-align:left;border:2.5px solid var(--ink);border-radius:18px;background:#fff;padding:10px 14px;font-size:14px;font-weight:600;transition:transform .12s,box-shadow .12s,background .2s}
.stepcard:hover{transform:translate(-2px,-2px) rotate(-.5deg);box-shadow:4px 4px 0 var(--ink);background:var(--sun)}

/* Babak 3 */
.sitcard{border:2.5px solid var(--ink);border-radius:22px;background:#fff;padding:14px 16px;margin-bottom:14px;font-weight:600}
.sitcard .n{display:inline-block;font-size:12px;font-weight:900;border:2.5px solid var(--ink);border-radius:99px;padding:0 12px;background:var(--amber);margin-bottom:6px;transform:rotate(-2deg)}
.sitcard.ok{background:var(--mint)}.sitcard.bad{background:var(--pink)}
.sres{margin-top:10px;font-size:14px}
.tog{display:grid;grid-template-columns:1fr 1fr;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;margin-top:10px;background:#fff}
.tog button{border:0;background:#fff;padding:11px 8px;font-weight:900;font-size:14px;line-height:1.25;color:var(--ink);transition:background .2s,transform .12s}
.tog button small{font-weight:700;font-size:12px;color:var(--muted)}
.tog button+button{border-left:2.5px solid var(--ink)}
.tog button:hover:not(:disabled){background:var(--sun)}
.tog button.on.t{background:var(--coral)}.tog button.on.p{background:var(--sage)}
.tog button.on small{color:var(--ink)}
.tog button:disabled{cursor:default}

.att span{border:2.5px solid var(--ink);border-radius:99px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;padding:1px 12px}
.sumhero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.sumhero .cm{width:110px;height:110px}

.foot{border-top:2.5px solid var(--ink);background:#fff;padding:16px;text-align:center;font-size:13.5px;font-weight:800}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;font-size:14px;z-index:50;transition:all .3s;max-width:90vw;text-align:center;border:2.5px solid #fff}

.mas{overflow:visible}
@keyframes popin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}

@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-30px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}8%{transform:rotate(-2deg)}16%{transform:rotate(2deg)}24%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(380deg)}}

var A={ctx:null,mus:null,sfx:null,musicOn:true,sfxOn:true,timer:null,next:0,step:0};
try{if(localStorage.getItem('pa_music')==='0')A.musicOn=false;if(localStorage.getItem('pa_sfx')==='0')A.sfxOn=false;}catch(e){}
function ac(){
  if(!A.ctx){
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{A.ctx=new C();}catch(e){return null;}
    var m=A.ctx.createGain();m.gain.value=0.9;m.connect(A.ctx.destination);
    A.mus=A.ctx.createGain();A.mus.gain.value=0.36;A.mus.connect(m);
    A.sfx=A.ctx.createGain();A.sfx.gain.value=0.9;A.sfx.connect(m);
  }
  if(A.ctx.state==='suspended'){try{A.ctx.resume();}catch(e){}}
  return A.ctx;
}
function mf(m){return 440*Math.pow(2,(m-69)/12);}
function tone(f,t,d,type,v,dest,to){
  var c=A.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.05);
}
function noise(t,d,f1,f2,v,dest){
  var c=A.ctx,n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(var i=0;i<n;i++)a[i]=Math.random()*2-1;
  var s=c.createBufferSource();s.buffer=b;
  var f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);f.Q.value=1.2;
  var g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t);
}

/* Musik latar: C - G - Am - F, 112 bpm, nuansa lo-fi pop */
var CH=[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]],PAT=[0,1,2,3,2,1,3,2];
function bgmStep(step,t,e){
  var bar=Math.floor(step/8)%4,i=step%8,ch=CH[bar];
  tone(mf(ch[PAT[i]]),t,e*1.5,'triangle',0.09,A.mus);
  if(i===0||i===3||i===4)tone(mf(ch[0]-24),t,e*2.4,'sine',0.17,A.mus);
  if(i===0||i===4)tone(140,t,0.13,'sine',0.22,A.mus,45);
  if(i===2||i===6)noise(t,0.07,2500,1500,0.06,A.mus);
  if(i%2===1)noise(t,0.03,8000,9500,0.045,A.mus);
  if(i===5&&(bar===1||bar===3))tone(mf(ch[3]+12),t,e*2,'sine',0.06,A.mus);
}
function bgmTick(){
  var c=A.ctx;if(!c||!A.musicOn)return;
  var e=60/112/2;
  if(A.next<c.currentTime-0.5)A.next=c.currentTime+0.05;
  while(A.next<c.currentTime+0.4){bgmStep(A.step,A.next,e);A.next+=e;A.step=(A.step+1)%32;}
}
function bgmStart(){if(A.timer||!A.musicOn||!ac())return;A.next=A.ctx.currentTime+0.1;A.step=0;A.timer=setInterval(bgmTick,120);}
function bgmStop(){if(A.timer){clearInterval(A.timer);A.timer=null;}}
function syncSnd(){
  var m=$('#btn-mus'),s=$('#btn-sfx');
  if(m){m.classList.toggle('off',!A.musicOn);m.setAttribute('aria-pressed',A.musicOn?'true':'false');}
  if(s){s.classList.toggle('off',!A.sfxOn);s.setAttribute('aria-pressed',A.sfxOn?'true':'false');}
}

/* ---------- Efek visual: confetti & percikan ---------- */
var FXS={ps:[],run:false,cv:null,cx:null};
var COLS=['#3347FF','#FF6F5E','#FFC53D','#59C08A','#FFFFFF','#B35CFF'];
function fxSize(){var c=FXS.cv;if(!c)return;c.width=window.innerWidth;c.height=window.innerHeight;}
function burst(x,y,n,pow){
  if(REDUCE||!FXS.cv||!FXS.cx)return;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=(Math.random()*0.6+0.4)*pow;
    FXS.ps.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-pow*0.5,s:Math.random()*5+4,c:COLS[(Math.random()*COLS.length)|0],r:Math.random()*6,vr:(Math.random()-0.5)*0.4,l:1,d:Math.random()*0.012+0.012,round:Math.random()<0.3});
  }
  if(!FXS.run){FXS.run=true;requestAnimationFrame(fxLoop);}
}
function fxLoop(){
  var cx=FXS.cx,cv=FXS.cv,ps=FXS.ps;
  cx.clearRect(0,0,cv.width,cv.height);
  for(var i=ps.length-1;i>=0;i--){
    var p=ps[i];p.vy+=0.22;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=p.d;
    if(p.l<=0||p.y>cv.height+20){ps.splice(i,1);continue;}
    cx.save();cx.globalAlpha=Math.min(1,p.l*1.6);cx.translate(p.x,p.y);cx.rotate(p.r);
    cx.fillStyle=p.c;cx.strokeStyle='#1B1F3B';cx.lineWidth=1.5;
    if(p.round){cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill();cx.stroke();}
    else{cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);cx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*0.66);}
    cx.restore();
  }
  if(ps.length)requestAnimationFrame(fxLoop);else{FXS.run=false;cx.clearRect(0,0,cv.width,cv.height);}
}

function dtag(l,d){return '<span class="delta '+(d>=0?'pos':'neg')+'">'+l+' '+(d>=0?'+':'')+d+'</span>';}
function syncTop(){
  var chips=$('#chips'),meters=$('#meters');
  if(S.user){chips.hidden=false;$('#c-user').textContent=S.user.nama+' · NIK '+S.user.nik;}else chips.hidden=true;
  var cs=$('#c-sc');if(S.sc&&S.phase>=1){cs.hidden=false;cs.textContent=S.sc.short;}else cs.hidden=true;
  meters.hidden=!(S.user&&S.sc&&S.phase>=1);
  updateMeters();
}
function renderStepper(){
  $('#stepper').innerHTML=PHASES.map(function(n,i){
    var c=i===S.phase?'on':(i<S.phase?'done':'');
    return '<div class="step '+c+'"'+(i===S.phase?' aria-current="step"':'')+'><i>'+(i<S.phase?'✓':i+1)+'</i>'+n+'</div>';
  }).join('');
}
function go(n){
  S.phase=n;
  [renderHome,renderB1,renderB2,renderB3,renderSum][n]();
  renderStepper();syncTop();
  if(n===0)sfx('start');else sfx('whoosh');
  stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');
  window.scrollTo(0,0);
}
function look(sel,pos){var el=$(sel);if(el)el.scrollIntoView({behavior:REDUCE?'auto':'smooth',block:pos||'center'});}
function phaseHead(n,t,sub){return '<div class="phead"><div class="pnum">'+n+'</div><div><h2>'+t+'</h2><p class="muted">'+sub+'</p></div></div>';}
function coach(text,mood){return '<div class="coach"><div class="cm">'+mascot(mood||moodOf(S.ind.trust),62)+'</div><div class="cb">'+text+'</div></div>';}
function fbox(cls,mood,head,txt,extra){
  return '<div class="fb '+cls+'"><div class="fm">'+mascot(mood,58)+'</div><div><b>'+head+'</b>'+txt+(extra?'<div style="margin-top:6px">'+extra+'</div>':'')+'</div></div>';
}
function scenarioPicker(sel){
  return '<div class="seg" id="seg">'+Object.keys(SC).map(function(k){var c=SC[k];
    return '<label class="'+(sel===k?'on':'')+'"><input type="radio" name="sc" value="'+k+'"'+(sel===k?' checked':'')+'><span><b>'+c.name+'</b><small>'+c.desc+'</small></span></label>';}).join('')+'</div>';
}
function bindPicker(){
  $$('#seg input').forEach(function(inp){inp.addEventListener('change',function(){
    S.pick=inp.value;sfx('pop');$$('#seg label').forEach(function(l){l.classList.toggle('on',$('input',l).checked);});});});
}
function attLine(n){return n<=1?'langsung pas':'berhasil di percobaan ke-'+n;}

/* ---------- Babak 1 ---------- */
function renderB1(){
  var sc=S.sc,b=S.b1,slots=sc.b1.slots;
  var all=b.fill.every(function(v){return v!==null;});
  var no=b.mode==='edit'?b.att+1:b.att;
  var compose=slots.map(function(s,i){
    var v=b.fill[i];
    if(v===null)return '<span class="slot">['+s.label+']</span>';
    var cls='slot';
    if(b.mode!=='edit'&&b.res)cls+=' q'+s.chips[v].q;else if(b.locked[i])cls+=' q2';
    var can=b.mode==='edit'&&!b.locked[i];
    return '<button type="button" class="'+cls+'" data-clear="'+i+'" '+(can?'title="Ketuk untuk mengosongkan"':'disabled')+'>'+s.chips[v].t+'</button>';
  }).join(' ');
  var html='<div class="bento"><section class="card s12">'+phaseHead(1,'Susun Kalimat Ajakan','Materi 4.1 · Non-kaku + “The Why”')+
    '<div class="sit"><b>Situasi</b>'+sc.b1.situasi+'</div>'+
    coach('Formula ajakan luwes: <b>Empati</b> → <b>The Why</b> → <b>Ajak bareng</b>. Ketiganya harus pas dulu sebelum bisa lanjut.')+
    '<div class="compose"><div class="lb">💬 Draft pesan ke tim'+(no>1?' · percobaan ke-'+no:'')+'</div><div class="draft">'+compose+'</div></div>';
  if(b.mode==='edit'){
    var groups=slots.map(function(s,si){
      var head='<div class="gh"><span class="gn">'+(si+1)+'</span><div><b>'+s.label+'</b><small>'+s.hint+'</small></div></div>';
      if(b.locked[si])return '<div class="grp">'+head+'<div class="glock">✔ Slot ini sudah tepat dan terkunci</div></div>';
      return '<div class="grp">'+head+'<div class="chipwrap">'+b.order[si].map(function(ci){
        var c=s.chips[ci],on=b.fill[si]===ci,tr=b.tried[si].indexOf(ci)>=0;
        return '<button type="button" class="cp'+(on?' on':'')+(tr?' tried':'')+'" data-s="'+si+'" data-c="'+ci+'" aria-pressed="'+on+'" '+(tr?'disabled':'')+'>'+c.t+(tr?'<span class="tt">sudah dicoba · belum pas</span>':'')+'</button>';}).join('')+'</div></div>';
    }).join('');
    html+='<p style="font-weight:700">Ketuk chip untuk mengisi slot. Ketuk slot yang terisi untuk mengosongkannya.</p>'+groups+
      '<div class="row"><button class="btn" id="send" '+(all?'':'disabled')+'>Kirim Arahan ke Tim 🚀</button>'+(all?'':'<span class="hint">Lengkapi slot yang kosong dulu.</span>')+'</div>';
  }else html+=resultB1();
  html+='</section></div>';
  stage.innerHTML=html;
  $$('.cp').forEach(function(el){el.addEventListener('click',function(){
    if(b.mode!=='edit')return;var si=+el.getAttribute('data-s'),ci=+el.getAttribute('data-c');
    b.fill[si]=(b.fill[si]===ci)?null:ci;sfx('pop');renderB1();});});
  $$('[data-clear]').forEach(function(el){el.addEventListener('click',function(){
    if(b.mode!=='edit')return;b.fill[+el.getAttribute('data-clear')]=null;renderB1();});});
  var sd=$('#send');if(sd)sd.addEventListener('click',sendB1);
  var rt=$('#retry1');if(rt)rt.addEventListener('click',function(){
    sc.b1.slots.forEach(function(s,i){if(b.res.q[i]===2)b.locked[i]=true;else{b.tried[i].push(b.fill[i]);b.fill[i]=null;}});
    b.res=null;b.mode='edit';sfx('retry');renderB1();look('.compose','start');});
  var nx=$('#nx1');if(nx)nx.addEventListener('click',function(){go(2);});
}
function sendB1(){
  var sc=S.sc,b=S.b1,q=[],total=0;
  sc.b1.slots.forEach(function(s,i){var v=s.chips[b.fill[i]].q;q.push(v);total+=v;});
  b.att++;
  var tier=total===6?'hi':(total>=4?'mid':(total>=2?'low':'bad'));
  b.res={q:q,total:total,tier:tier};
  if(total===6){
    b.mode='done';b.dt=14;S.ind.kel=fin(b.att);addTrust(14);celebrate();sfx('good');toast(TIER.hi.head);
  }else{
    b.mode='review';b.dt=TIER[tier].dt;addTrust(b.dt);sfx(tier==='mid'?'mid':'bad');toast(TIER[tier].head);
  }
  renderB1();look('.react');
}
function resultB1(){
  var sc=S.sc,b=S.b1,r=b.res,t=TIER[r.tier],rx=sc.b1.reactions[r.tier],done=b.mode==='done';
  var rows=sc.b1.slots.map(function(s,i){var c=s.chips[b.fill[i]];
    return '<div class="fbrow q'+c.q+'"><span class="qt">'+QL[c.q]+'</span><div><b>'+s.label+'</b><br>'+c.why+'</div></div>';}).join('');
  var team=rx.map(function(m,i){
    return '<div class="mem t-'+r.tier+'"><div class="f">'+faceSVG(t.mood[i],LOOKS[i])+'</div><div class="bb"><small>'+m.n+'</small>'+m.line+'<span class="em">'+t.emo[i]+'</span></div></div>';}).join('');
  var h='<div class="react"><div class="rhead">'+signalSVG(t.bars,t.color)+'<div><b>Sinyal respons tim: '+t.lbl+'</b><span>Skor luwes '+r.total+'/6</span></div></div><div class="team">'+team+'</div></div>';
  h+=fbox(done?'hi':(r.tier==='mid'?'mid':'low'),done?'cheer':(r.tier==='mid'?'neutral':'worried'),t.head,
    done?'Pesan Anda '+attLine(b.att)+'. Tim paham alasannya dan merasa diajak, bukan disuruh.':t.txt+' Slot yang sudah luwes akan terkunci, ganti yang masih kurang.',
    dtag('Trust',b.dt)+(done?'<span class="delta">Keluwesan &amp; “The Why” '+S.ind.kel+'</span>':''));
  h+='<h3>Kenapa begini?</h3>'+rows;
  h+='<div class="row" style="margin-top:12px">'+(done?'<button class="btn go" id="nx1">Lanjut ke Babak 2 →</button>':'<button class="btn coral" id="retry1">Coba Lagi 🔁</button><span class="hint">Belum tepat, jadi belum bisa lanjut.</span>')+'</div>';
  return h;
}

/* ---------- Babak 2 ---------- */
function renderB2(){
  var b2=S.b2,html='<div class="bento"><section class="card s12">'+phaseHead(2,'Saring Kaku &amp; Urutkan STAR','Materi 4.2 · Tap-to-Flag dan Tap-to-Sequence')+
    coach('<b>Tegas ≠ kaku.</b> Tegas = jelas + sopan + ada alasan. Yang perlu ditandai: nyuruh mentah, mengancam, atau membalas dengan emosi.')+partA()+'</section>';
  if(b2.a.mode==='done')html+='<section class="card s12" id="partB">'+partB()+'</section>';
  html+='</div>';
  stage.innerHTML=html;
  var a=b2.a;
  $$('.phr').forEach(function(el){el.addEventListener('click',function(){
    if(a.mode!=='edit')return;var i=el.getAttribute('data-i');if(a.st[i])return;
    a.flags[i]=!a.flags[i];sfx('flag');renderB2();});});
  var lk=$('#lockA');if(lk)lk.addEventListener('click',lockA);
  var rt=$('#retryA');if(rt)rt.addEventListener('click',function(){
    a.curFp=[];S.sc.b2.phrases.forEach(function(p,i){a.flags[i]=(a.st[i]==='ok');});
    a.mode='edit';sfx('retry');renderB2();});
  var b=b2.b;
  $$('[data-add]').forEach(function(el){el.addEventListener('click',function(){
    if(b.mode!=='edit')return;var k=b.slots.indexOf(null);if(k<0)return;b.slots[k]=+el.getAttribute('data-add');sfx('pop');renderB2();});});
  function swap(p,q){if(q<0||q>3||b.lock[p]||b.lock[q])return;var t=b.slots[p];b.slots[p]=b.slots[q];b.slots[q]=t;sfx('tap');renderB2();}
  $$('[data-up]').forEach(function(el){el.addEventListener('click',function(){var p=+el.getAttribute('data-up');swap(p,p-1);});});
  $$('[data-dn]').forEach(function(el){el.addEventListener('click',function(){var p=+el.getAttribute('data-dn');swap(p,p+1);});});
  $$('[data-rm]').forEach(function(el){el.addEventListener('click',function(){var p=+el.getAttribute('data-rm');if(!b.lock[p]){b.slots[p]=null;renderB2();}});});
  var rs=$('#resetB');if(rs)rs.addEventListener('click',function(){b.slots=b.slots.map(function(v,i){return b.lock[i]?v:null;});renderB2();});
  var ap=$('#applyB');if(ap)ap.addEventListener('click',applyB);
  var rb=$('#retryB');if(rb)rb.addEventListener('click',function(){
    b.slots=b.slots.map(function(v,i){if(b.res[i]){b.lock[i]=true;return v;}return null;});
    b.res=null;b.mode='edit';sfx('retry');renderB2();look('#partB','start');});
  var nx=$('#nx2');if(nx)nx.addEventListener('click',function(){go(3);});
}
function partA(){
  var sc=S.sc,a=S.b2.a,ob=sc.b2.objector,ph=sc.b2.phrases,pending=0,remaining=0,need=0;
  ph.forEach(function(p,i){if(!a.st[i]&&a.flags[i])pending++;if(p.flag){need++;if(a.st[i]!=='ok')remaining++;}});
  var items=S.b2.aOrder.map(function(i){
    var p=ph[i],cls='phr',tail='',dis=true,on=!!a.flags[i];
    if(a.st[i]==='ok'){cls+=' ok';tail='<span class="vd">✔ Tepat ditandai · '+p.type+'</span><span class="why">'+p.why+'</span>';}
    else if(a.st[i]==='no'){
      if(a.mode==='review'&&a.curFp.indexOf(i)>=0){cls+=' bad';tail='<span class="vd">✘ Salah tandai · kalimat ini tidak kaku/menekan</span><span class="why">'+p.why+'</span>';}
      else{cls+=' fine';tail='<span class="vd">✓ Bukan kaku/menekan</span><span class="why">'+p.why+'</span>';}
    }else if(a.mode==='done'){cls+=' fine';tail='<span class="vd">✓ Tepat dibiarkan</span><span class="why">'+p.why+'</span>';}
    else if(a.mode==='edit'){dis=false;if(on)cls+=' flag';}
    return '<button type="button" class="'+cls+'" data-i="'+i+'" aria-pressed="'+(on&&!a.st[i])+'" '+(dis?'disabled':'')+'>'+(on&&!a.st[i]&&a.mode==='edit'?'<span class="ftag">🚩 Ditandai</span>':'')+p.t+tail+'</button>';
  }).join('');
  var no=a.mode==='edit'?a.att+1:a.att;
  var h='<h3>Bagian A · Tap-to-Flag'+(no>1?' · percobaan ke-'+no:'')+'</h3><div class="ob"><div class="f">'+faceSVG('tense',LOOKS[1])+'</div><div class="bb"><small>'+ob.n+'</small>'+ob.line+'</div></div>'+
    '<p style="font-weight:700">Ini potongan kalimat yang bisa muncul dari Anda atau rekan manajer. Ketuk yang tergolong <b>Kaku / Menekan / Reaktif</b> untuk menandainya. Tegas yang sopan dan beralasan bukan termasuk kaku.</p>'+
    '<div class="phs">'+items+'</div>';
  if(a.mode==='edit'){
    h+='<div class="row"><button class="btn coral" id="lockA" '+((pending>0||remaining===0)?'':'disabled')+'>Kunci Flag 🚩</button><span class="hint">'+(remaining===0&&pending===0?'Semua kalimat bermasalah sudah ditemukan. Tekan Kunci Flag untuk melanjutkan.':'Ditandai baru: '+pending+' kalimat')+'</span></div>';
  }else if(a.mode==='review'){
    h+=fbox(a.fp?'low':'mid','worried','Belum tepat: '+a.tp+' dari '+need+' kalimat bermasalah ditemukan',
      (a.fp?'Salah tandai: '+a.fp+'. ':'')+(a.miss?'Masih ada '+a.miss+' kalimat bermasalah yang belum ditandai. ':'')+
      'Ingat: sikap <b>tegas (assertive)</b> menyampaikan batas dengan jelas dan hormat, sedangkan kalimat kaku, menekan, atau reaktif menyerang orang atau menutup dialog. Yang sudah tepat akan terkunci.',dtag('Trust',a.dt))+
      '<div class="row"><button class="btn coral" id="retryA">Coba Lagi 🔁</button><span class="hint">Belum tepat, jadi belum bisa lanjut ke bagian B.</span></div>';
  }else{
    h+=fbox('hi','cheer','Mantap! Semua kalimat bermasalah ketemu ✔','Penyaringan Anda '+attLine(a.att)+'. Anda bisa membedakan tegas yang sehat dari kalimat yang kaku, menekan, atau reaktif.',dtag('Trust',a.dt)+'<span class="delta">Skor penyaringan '+a.pct+'</span>');
  }
  return h;
}
function lockA(){
  var sc=S.sc,a=S.b2.a,ph=sc.b2.phrases,fp=[];
  ph.forEach(function(p,i){if(a.st[i]||!a.flags[i])return;if(p.flag)a.st[i]='ok';else{a.st[i]='no';fp.push(i);}});
  var need=0,ok=0;ph.forEach(function(p,i){if(p.flag){need++;if(a.st[i]==='ok')ok++;}});
  var miss=need-ok;a.att++;a.curFp=fp;a.tp=ok;a.fp=fp.length;a.miss=miss;
  if(fp.length===0&&miss===0){
    a.mode='done';a.pct=fin(a.att);a.dt=10;S.ind.sik=a.pct;addTrust(10);celebrate();sfx('good');toast('Flag tepat semua ✔');
  }else{
    a.mode='review';a.dt=-(fp.length*3+miss*2);addTrust(a.dt);sfx(fp.length?'bad':'mid');toast('Belum tepat, coba lagi');
  }
  renderB2();look(a.mode==='done'?'#partB':'.fb','center');
}
function partB(){
  var sc=S.sc,b=S.b2.b,star=sc.b2.star,rows='';
  for(var pos=0;pos<4;pos++){
    var ci=b.slots[pos];
    if(ci===null){rows+='<div class="slotrow"><span class="no">'+(pos+1)+'</span><span class="hint">Ketuk kartu langkah di bawah untuk mengisi urutan ke-'+(pos+1)+'</span></div>';continue;}
    var c=star[ci];
    if(b.mode==='done'||b.lock[pos]||(b.mode==='review'&&b.res[pos])){
      rows+='<div class="slotrow filled ok"><span class="no">'+(pos+1)+'</span><div><b>✔ '+c.lbl+'</b> · '+c.t+'<small>'+c.why+'</small></div></div>';
    }else if(b.mode==='review'){
      rows+='<div class="slotrow filled bad"><span class="no">'+(pos+1)+'</span><div><b>✘ Belum tepat di urutan ke-'+(pos+1)+'</b> · '+c.t+'<small>Coba tukar. Ingat: tahan reaksi dulu, pahami, nilai, baru merespons.</small></div></div>';
    }else{
      rows+='<div class="slotrow filled"><span class="no">'+(pos+1)+'</span><span>'+c.t+'</span><span class="ctl"><button type="button" class="mini" data-up="'+pos+'" aria-label="Naikkan" '+((pos===0||b.lock[pos-1])?'disabled':'')+'>▲</button><button type="button" class="mini" data-dn="'+pos+'" aria-label="Turunkan" '+((pos===3||b.lock[pos+1])?'disabled':'')+'>▼</button><button type="button" class="mini" data-rm="'+pos+'" aria-label="Lepas kartu">✕</button></span></div>';
    }
  }
  var no=b.mode==='edit'?b.att+1:b.att;
  var h='<h3>Bagian B · Tap-to-Sequence'+(no>1?' · percobaan ke-'+no:'')+'</h3>'+
    coach('Jeda dulu sebelum bales. Urutan <b>STAR</b> itu rem tangan kamu saat ada keberatan.','neutral')+
    '<p style="font-weight:700">Susun <b>urutan respons STAR</b> saat tim menyampaikan keberatan: ketuk kartu sesuai urutan, lalu gunakan ▲ ▼ untuk menukar posisi.</p>'+
    '<div class="starleg"><span>S · Stop</span><span>T · Think</span><span>A · Assess</span><span>R · Respond</span></div>'+rows;
  if(b.mode==='edit'){
    var pool=b.order.filter(function(i){return b.slots.indexOf(i)<0;}).map(function(i){return '<button type="button" class="stepcard" data-add="'+i+'">'+star[i].t+'</button>';}).join('');
    var full=b.slots.indexOf(null)<0;
    h+=(pool?'<div class="pool">'+pool+'</div>':'')+
      '<div class="row"><button class="btn" id="applyB" '+(full?'':'disabled')+'>Terapkan Respons STAR ⚡</button><button class="btn ghost" id="resetB">Reset urutan</button></div>';
  }else if(b.mode==='review'){
    var c2=b.res.filter(Boolean).length;
    h+=fbox('low','worried','Belum tepat: '+c2+' dari 4 langkah sudah pada tempatnya','Langkah yang sudah tepat akan terkunci. Susun ulang sisanya.',dtag('Trust',b.dt))+
      '<div class="row"><button class="btn coral" id="retryB">Coba Lagi 🔁</button><span class="hint">Belum tepat, jadi belum bisa lanjut ke Babak 3.</span></div>';
  }else{
    h+=fbox('hi','cheer','Urutan STAR sempurna ⚡','Respons Anda '+attLine(b.att)+'. Jeda STAR menjaga trust: Anda menahan reaksi, memahami kekhawatiran, menilai apakah ini batas wajib atau bisa dirundingkan, baru merespons.',
      dtag('Trust',b.dt)+'<span class="delta">Skor STAR '+b.pct+'</span><span class="delta">Ketepatan Sikap &amp; STAR '+S.ind.sik+'</span>')+
      '<div class="row"><button class="btn go" id="nx2">Lanjut ke Babak 3 →</button></div>';
  }
  return h;
}
function applyB(){
  var b=S.b2.b,res=[],c=0;
  b.slots.forEach(function(v,i){var ok=(v===i);res.push(ok);if(ok)c++;});
  b.att++;b.res=res;
  if(c===4){
    b.mode='done';b.pct=fin(b.att);b.dt=10;S.ind.sik=Math.round((S.b2.a.pct+b.pct)/2);addTrust(10);celebrate();sfx('good');toast('Urutan STAR tepat ⚡');
  }else{
    b.mode='review';b.dt=-(4-c)*2;addTrust(b.dt);sfx(c>=2?'mid':'bad');toast('Belum tepat, coba lagi');
  }
  renderB2();look('#partB .fb','center');
}

/* ---------- Babak 3 ---------- */
function renderB3(){
  var sc=S.sc,b=S.b3,all=b.choice.every(function(v){return v!==null;});
  var no=b.mode==='edit'?b.att+1:b.att;
  var cards=sc.b3.map(function(s,i){
    var ch=b.choice[i],cls='sitcard',res='',dis=b.mode!=='edit'||b.lock[i];
    if(b.mode==='edit'&&b.lock[i]){cls+=' ok';res='<div class="sres"><b>✔ Tepat dan terkunci</b></div>';}
    else if(b.mode!=='edit'){
      var ok=b.res[i];cls+=ok?' ok':' bad';
      var need=s.mode==='T'?'Tegas (Assertive)':'Persuasif';
      var cons=s.mode==='T'?'Terlalu lunak: batas wajib terasa bisa ditawar dan standar bisa bocor.':'Terlalu keras: tim merasa ditekan dan mulai menarik ulur.';
      res=ok?'<div class="sres"><b>✔ Mode tepat: '+need+'</b><br>'+s.why+'</div>':'<div class="sres"><b>✘ Belum tepat.</b> '+s.why+'<br><span class="hint" style="color:#3a4062">Dampak pilihan Anda: '+(ch==='P'?cons:'Terlalu keras: tim merasa ditekan dan mulai menarik ulur.')+'</span></div>';
    }
    return '<div class="'+cls+'"><span class="n">Situasi '+(i+1)+'</span><p>'+s.t+'</p><div class="tog" role="group" aria-label="Pilih mode sikap situasi '+(i+1)+'">'+
      '<button type="button" class="t'+(ch==='T'?' on':'')+'" data-i="'+i+'" data-m="T" aria-pressed="'+(ch==='T')+'" '+(dis?'disabled':'')+'>Tegas<br><small>Assertive · Batas Wajib</small></button>'+
      '<button type="button" class="p'+(ch==='P'?' on':'')+'" data-i="'+i+'" data-m="P" aria-pressed="'+(ch==='P')+'" '+(dis?'disabled':'')+'>Persuasif<br><small>Ajakan &amp; Keselarasan</small></button></div>'+res+'</div>';
  }).join('');
  var html='<div class="bento"><section class="card s12">'+phaseHead(3,'Penyelarasan Sikap &amp; Komitmen Aksi','Pilih mode sikap yang tepat untuk tiap situasi'+(no>1?' · percobaan ke-'+no:''))+
    coach('Pertanyaan kunci: ini <b>batas wajib</b>, atau masih <b>bisa dirembukkan</b>? Jawabannya menentukan mode sikap.')+
    '<p style="font-weight:700">Tiga situasi singkat muncul di lantai produksi. Pilih <b>Tegas (Assertive — Batas Wajib)</b> atau <b>Persuasif (Ajakan &amp; Keselarasan)</b> untuk masing-masing, lalu simpan keputusan Anda.</p>'+cards;
  if(b.mode==='edit')html+='<div class="row"><button class="btn" id="save" '+(all?'':'disabled')+'>Simpan Keputusan ✅</button>'+(all?'':'<span class="hint">Pilih mode untuk semua situasi yang belum terkunci.</span>')+'</div>';
  else if(b.mode==='review'){
    var okc=b.res.filter(Boolean).length;
    html+=fbox('low','worried','Belum tepat: '+okc+' dari 3 situasi sudah pas','Situasi yang sudah tepat akan terkunci. Baca alasan di tiap kartu lalu pilih ulang sisanya.',dtag('Trust',b.dt))+
      '<div class="row"><button class="btn coral" id="retry3">Coba Lagi 🔁</button><span class="hint">Belum tepat, jadi belum bisa lanjut ke ringkasan.</span></div>';
  }else{
    html+=fbox('hi','cheer','Semua mode tepat 🎉','Keputusan Anda '+attLine(b.att)+'. Tegas dipakai untuk batas wajib yang menyangkut mutu dan keselamatan pangan. Persuasif dipakai saat cara, waktu, atau beban kerja masih bisa dirundingkan. Keduanya tetap hormat.',dtag('Trust',b.dt))+
      '<div class="row"><button class="btn go" id="nx3">Lihat Ringkasan →</button></div>';
  }
  html+='</section></div>';
  stage.innerHTML=html;
  $$('.tog button').forEach(function(el){el.addEventListener('click',function(){
    if(b.mode!=='edit')return;var i=+el.getAttribute('data-i');if(b.lock[i])return;
    b.choice[i]=el.getAttribute('data-m');sfx('flag');renderB3();});});
  var sv=$('#save');if(sv)sv.addEventListener('click',function(){
    var res=[],r=0;sc.b3.forEach(function(s,i){var ok=b.choice[i]===s.mode;res.push(ok);if(ok)r++;});
    b.att++;b.res=res;
    if(r===3){b.mode='done';b.pct=fin(b.att);b.dt=12;addTrust(12);celebrate();sfx('good');toast('3 dari 3 tepat 🎉');}
    else{b.mode='review';b.dt=-(3-r)*5;addTrust(b.dt);sfx(r>=2?'mid':'bad');toast(r+' dari 3 tepat, coba lagi');}
    renderB3();look('.fb','center');});
  var rt=$('#retry3');if(rt)rt.addEventListener('click',function(){
    b.res.forEach(function(ok,i){if(ok)b.lock[i]=true;else b.choice[i]=null;});
    b.res=null;b.mode='edit';sfx('retry');renderB3();});
  var nx=$('#nx3');if(nx)nx.addEventListener('click',function(){go(4);});
}

/* ---------- Ringkasan ---------- */
function renderSum(){
  var kel=S.ind.kel===null?0:S.ind.kel,sik=S.ind.sik===null?0:S.ind.sik,tr=Math.round(S.ind.trust);
  var avg=(kel+sik+tr)/3;
  var rank=avg>=85?'Komunikator Persuasif Andal 🏆':(avg>=70?'Persuader Luwes ✨':(avg>=50?'Persuader Berkembang 🌱':'Terus Berlatih, Pasti Bisa 💪'));
  var sk=[{k:'ajakan',p:kel},{k:'filter',p:S.b2.a.pct},{k:'star',p:S.b2.b.pct},{k:'mode',p:S.b3.pct}];
  var best=sk.reduce(function(a,c){return c.p>a.p?c:a;},sk[0]);
  var worst=sk.reduce(function(a,c){return c.p<a.p?c:a;},sk[0]);
  var strength='<p><b>'+SKILL[best.k].n+' ('+best.p+'%)</b></p><p>'+SKILL[best.k].s+'</p>';
  var area=worst.p>=100?'<p><b>Semua area kuat.</b></p><p>Pertahankan kebiasaan ini saat situasi lantai produksi lebih padat.</p>':'<p><b>'+SKILL[worst.k].n+' ('+worst.p+'%)</b></p><p>'+SKILL[worst.k].i+'</p>';
  if(best.p===worst.p){
    strength='<p><b>Konsisten di keempat latihan ('+best.p+'%)</b></p><p>Kemampuan Anda merata: menyusun ajakan, menyaring kalimat, menjaga jeda STAR, dan memilih sikap.</p>';
    area=best.p>=100?'<p><b>Semua area kuat.</b></p><p>Pertahankan kebiasaan ini saat situasi lantai produksi lebih padat.</p>':'<p><b>Ketelitian di percobaan pertama</b></p><p>Biasakan membaca situasi dan alasannya dulu sebelum memilih, supaya jawaban sudah tepat sejak percobaan pertama.</p>';
  }
  var other=S.pick==='k1'?'k2':'k1';
  var chal=['Ganti satu kalimat kaku atau menekan hari ini dengan ajakan plus “the why”.','Sebelum merespons, bedakan dulu: tegas (batas wajib) atau persuasif (bisa dirundingkan)?','Saat ada keberatan, lakukan jeda STAR: Stop, Think, Assess, baru Respond.'];
  var att='<div class="att"><span>Babak 1: '+S.b1.att+'×</span><span>2A: '+S.b2.a.att+'×</span><span>2B: '+S.b2.b.att+'×</span><span>Babak 3: '+S.b3.att+'×</span></div>';
  stage.innerHTML='<div class="bento">'+
  '<section class="card c-grad s12"><div class="sumhero"><div><span class="tag">Misi 4 selesai</span><div class="rank">'+rank+'</div>'+
    '<p class="muted" style="margin-top:6px;font-weight:800">'+esc(S.user.nama)+' · NIK '+esc(S.user.nik)+'</p><p class="muted">'+S.sc.name+'</p></div><div class="cm">'+mascot(avg>=70?'cheer':(avg>=50?'happy':'neutral'),110)+'</div></div>'+
    '<div class="big" style="margin-top:14px"><div><strong>'+kel+'</strong><span>Keluwesan &amp; “The Why”</span></div><div><strong>'+sik+'</strong><span>Ketepatan Sikap &amp; STAR</span></div><div><strong>'+tr+'</strong><span>Trust &amp; Kesiapan Tim</span></div></div>'+att+'</section>'+
  '<section class="card c-mint s6"><span class="tag w">Kekuatan utama</span><h2>Yang sudah kuat 💪</h2>'+strength+'</section>'+
  '<section class="card c-sun s6"><span class="tag w">Perlu dibiasakan</span><h2>Area yang diasah 🌱</h2>'+area+'</section>'+
  '<section class="card s7"><span class="tag">Challenge harian</span><h2>3 kebiasaan untuk dicoba 🎯</h2><ul class="lst chal">'+
    chal.map(function(c,i){return '<li class="'+(S.chal[i]?'done':'')+'"><label><input type="checkbox" data-c="'+i+'"'+(S.chal[i]?' checked':'')+'><span>'+c+'</span></label></li>';}).join('')+'</ul>'+
    '<p class="hint" style="margin-top:10px">Centang saat Anda sudah mencobanya.</p></section>'+
  '<section class="card c-lilac s5"><span class="tag w">Main lagi</span><h2>Coba kasus lain 🔁</h2>'+scenarioPicker(other)+
    '<div class="row" style="margin-top:16px"><button class="btn go" id="again">Main Lagi / Ganti Skenario</button><button class="btn ghost" id="who">Ganti Peserta</button></div></section>'+
  '</div>';
  S.pick=other;bindPicker();
  setMascot(avg>=70?'cheer':moodOf(S.ind.trust));
  setTimeout(function(){sfx(avg>=70?'fanfare':'good');if(avg>=70)burstScreen();},350);
  $$('.chal input').forEach(function(inp){inp.addEventListener('change',function(){
    var i=+inp.getAttribute('data-c');S.chal[i]=inp.checked;sfx(inp.checked?'good':'tap');if(inp.checked)burst(inp.getBoundingClientRect().left,inp.getBoundingClientRect().top,18,7);inp.closest('li').classList.toggle('done',inp.checked);});});
  $('#again').addEventListener('click',function(){newGame(S.pick);go(1);});
  $('#who').addEventListener('click',function(){S.user=null;S.sc=null;S.ind={kel:null,sik:null,trust:50};setMascot('happy');go(0);});
}

/* ---------- init ---------- */
setMascot('happy');
FXS.cv=document.getElementById('fx');
if(FXS.cv&&FXS.cv.getContext){FXS.cx=FXS.cv.getContext('2d');fxSize();window.addEventListener('resize',fxSize);}
syncSnd();
function unlock(){ac();if(A.musicOn)bgmStart();}
document.addEventListener('pointerdown',unlock,true);
document.addEventListener('keydown',unlock,true);
document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;
  var b=t.closest('button, .seg label');
  if(!b||b.disabled||b.id==='btn-mus'||b.id==='btn-sfx')return;
  if(b.matches('.cp,.phr,.stepcard,.tog button,.slot,.seg label,.mini'))return;
  sfx('tap');if(e.detail)burst(e.clientX,e.clientY,6,4);
});
$('#btn-mus').addEventListener('click',function(){
  A.musicOn=!A.musicOn;try{localStorage.setItem('pa_music',A.musicOn?'1':'0');}catch(e){}
  if(A.musicOn){if(ac())bgmStart();}else bgmStop();
  syncSnd();toast(A.musicOn?'Musik latar menyala 🎵':'Musik latar dimatikan');
});
$('#btn-sfx').addEventListener('click',function(){
  A.sfxOn=!A.sfxOn;try{localStorage.setItem('pa_sfx',A.sfxOn?'1':'0');}catch(e){}
  syncSnd();toast(A.sfxOn?'Efek suara menyala 🔊':'Efek suara dimatikan');if(A.sfxOn)sfx('good');
});
document.addEventListener('visibilitychange',function(){
  if(!A.ctx)return;
  if(document.hidden){try{A.ctx.suspend();}catch(e){}}else{try{A.ctx.resume();}catch(e){}}
});
go(0);

})();
</script>
